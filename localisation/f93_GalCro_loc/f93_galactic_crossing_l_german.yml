#Events
 f93_galactic_crossing.2.desc:0 "§LAn allegedly ancient and alien §Ytablet§! was found, it is highly controversial due to dating or deriving good data from it, in any way, proves difficult.\nWithout solid data, the scientific community is unwilling to make any definitive statement. Is it §Greal?§! or §Rnot?§!. Shortly after the publication of the first report, the artifact was transferred into a private collection. It is unknown who orchestrated this. Despite best efforts the §Ytablet§! could not be found anymore.\n\nThe few images we have display a scene of unity among many strange creatures. Notably none of the creatures could be identified as §Y[Root.GetSpeciesName]§!"
 f93_galactic_crossing.2.name:0 "Real or Hoax?"
 f93_galactic_crossing.8.a:0 "...All statements made without guarantees."
 f93_galactic_crossing.8.desc:0 "Out of §G[root.f93_num_systems]§! systems: §Y[root.f93_num_shrouded_systems]§! Systems are shrouded systems. ~§Y[root.f93_star_ration_percent]%§!.\n\nIt is up to you if this is good or bad."
 f93_galactic_crossing.8.green:0 "We have run the numbers and your game start seems\n\n§GGood§!.\n\nHave fun!\n\n$f93_galactic_crossing.8.desc$"
 f93_galactic_crossing.8.name:0 "Game Start Quality"
 f93_galactic_crossing.8.red:0 "We have run the numbers and your game start seems\n\n§MIsolated§!.\n\n§GHave fun!§!\n\n$f93_galactic_crossing.8.desc$"
 f93_galactic_crossing.8.yellow:0 "We have run the numbers and your game start seems\n\n§YOk§!.\n\nHave fun!\n\n$f93_galactic_crossing.8.desc$"
 f93_ralis_failed_to_form:0 "§RWARNING:§! A planet critical for the campaign failed to form, this will lead to problems down the line.\n\n$f93_galactic_crossing.8.desc$"

# Origins
 pc_zro_desert:0 "Zro World"
 pc_zro_desert_desc:0 "A Shroud Rift tears at the upper atmosphere of this world, bleeding raw psionic energies and Zro onto the planet's surface. The atmospheric disturbances cause perpetual storms to range across the southern hemisphere.  Planet has the §rZro Downpour§! modifier."
 pc_zro_desert_moon:0 "$pc_zro_desert$"
 pc_zro_desert_moon_desc:0 "$pc_zro_desert_desc$"
 children_of_the_zro:0 "Children of Zro"
 children_of_the_zro_desc:0 "§RWARNING: Only access to §r['concept_shroud_strider']§! FTL technologies§!\n\nPlagued by horrors lurking within Hyperspace, conventional Hyperlane travel became a great strain for this civilization. Thus, the Palace has sought to create Shroud Striders, beings capable of navigating the Shroud, yet stabilizing passages remains beyond their abilities.\n\nBut the Palace hides a secret: its supply of Zro is running out, and its Seers have long heard the callings from a nearby world where Zro is said to rain from the skies.\n['concept_f93_origin_children_zro_tips']"
 START_SCREEN_PART_ONE_children_of_the_zro:0 "Plagued by horrors lurking within Hyperspace, conventional Hyperlane travel became a great strain for this civilization. Thus, the Palace has sought to create Shroud Striders, beings capable of navigating the Shroud, yet stabilizing passages remains beyond their abilities.\n\nBut the Palace hides a secret: its supply of Zro is running out, and its Seers have long heard the callings from a nearby world where Zro is said to rain from the skies."
