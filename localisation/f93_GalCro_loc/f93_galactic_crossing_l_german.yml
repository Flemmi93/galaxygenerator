 f93_hyperspace_nightmares:0 "Hyperspace Nightmares"
 f93_hyperspace_nightmares_desc:0 "Entities lurking within Hyperspace torment our Shroud Striders, rendering travel through the dimension agonizingly slow and unpractical beyond exploration missions."
 concept_zro_must_flow:0 "Zro Must Flow"
 concept_zro_must_flow_desc:0 "$i_zro$ fuels our people's existence. Without it, our society would crumble into madness."
