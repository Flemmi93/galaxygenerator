 f93_expanded_drifter_operations_desc:0 "A large scale Drifter Outpost away from the safe North of the planet."
 f93_drifter_existance:0 "Zro Driftwatch"
 f93_drifter_existance_desc:0 "Here, the movements of [Planet.GetName]'s countless registered Zro Drifters are being tracked across a holographic storm-map, allowing harvest fleets to be directed toward the richest stormfronts.\n$f93_drifter_existance_effect$"
 f93_drifter_existance_effect:0 "Slowly Converts §Y95%§! of Technicians into Zro Drifters"
