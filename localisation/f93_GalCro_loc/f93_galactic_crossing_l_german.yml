 concept_shroud_strider:0 "Shroud Strider"
 concept_shroud_strider_desc:0 "These psionics were reduced to only their brains and spinal cords, tethered to tanks that pump Zro into their brainstems. The gained foresight allows them to guide their ships across the galaxy.\n\nThey require a constant supply of $i_zro$ to survive."
