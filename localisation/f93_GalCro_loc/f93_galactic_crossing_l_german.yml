 f93_north_superport:0 "Northern Superport"
 f93_north_superport_desc:0 "High in the north stands a colossal spaceport through which the harvested Zro is gathered before being shipped across the Realm."
 d_anti_shroudstone_auro:0 "$f93_zro_knight$ Inquisition"
 d_anti_shroudstone_auro_desc:0 "The $f93_zro_knight$ Inquisition has been dispatched to this world to safeguard its sacred Shroud sites and preserve them from industrialists."
# origin events
 f93_cozro.6.name:0 "Zro Drifter"
 f93_cozro.6.desc:0 "Enough infrastructure has been established across the North Pole of [This.GetName] to coordinate large scale Zro harvesting operations.\n\nAboard gravity-sail speeders, Zro Drifters chase the ever-shifting pressure fronts of the equatorial storm belts, where they collect windborne Zro during the rare moments when the downpour thins enough to be handled safely."
 f93_cozro.6.a:0 "The Zro will flow"
 f93_cozro.6.a_effect:0 "$t$ - §Y$concept_technician$§! will be converted into §Y$concept_zro_drifter$§!"
 f93_cozro.7.name:0 "Northern Superport"
 f93_cozro.7.desc:0 "Latest reports from §Y[This.GetName]§! speak of a growing bottleneck in the northern ports' capacity to store and ship Zro off-world.\n\nThus, by decree of the Palace, a colossal superport shall be constructed to open up the bottleneck and elevate the world's logistical capacity to the scales suited for a vast interstellar Realm."
 f93_cozro.7.a:0 "By decree, let's do this!"
 f93_cozro.8.name:0 "The Untouchable"
 f93_cozro.8.desc:0 "We have amassed so much Zro from the Rift that the world now generates more Zro in a few decades than the Palace had harvested in an entire millennium. Yet, we cannot silence the hunger within us.\n\nThe Rift was long regarded as sacred and untouchable, but this caution has begun to fade. What truths might lie within the Rift? What powers, or beings, could be beyond it?"
 f93_cozro.8.a:0 "Let the Rift reveal its truths to us."
 f93_cozro.9.name:0 "The Weight of Zro"
 f93_cozro.9.desc:0 "The endless wealth flowing from §Y[This.GetName]§! has now surpassed the amount that the Palace had produced in the entire last millennium. We have elevated the title of Liege to powers never intended for it, and with every shipment of Zro will the authority of the Palace diminishes further.\n\nSome propose elevating the title of Liege into the Imperial Council, binding the Liege closer to the Palace and its intrigues. Others argue the Palace must abandon its struggle for material supremacy entirely and instead embrace its spiritual authority, sanctifying the Homeworld and Palace as the holy heart of the Realm."
 f93_cozro.9.a:0 "Elevate the Liege"
 f93_cozro.9.b:0 "Sanctify the Homeworld: [Owner.GetHomeWorldName]"
 f93_cozro.10.name:0 "Elevanting the Liege"
 f93_cozro.10.desc:0 "The title of Liege has been elevated into the Empire's §Y['concept_council']§!.\nIts holder is now required to reside at the Palace regularely, attending court, advising the Throne, and entangling themselves within the intrigues of Imperial politics.\n\nThough this grants the Liege immense prestige, it also draws their attention away from consolidating power on [This.GetName]."
 f93_cozro.10.a:0 "A leash"
 f93_cozro.10.effect:0 "Unlocks the §YLiege§! Councilor position."
 f93_cozro.11.name:0 "Holy Heart"
 f93_cozro.11.desc:0 "The Homeworld §Y[Owner.GetHomeWorldName]§! and site of the Palace have been formally sanctified as the Holy Heart of the Realm. Pilgrims now gather before the walls of the palace and prayers from all around the Realm are directed to the Homeworld.\n\nThough the wealth of §Y[This.GetName]§! may surpass that of the Palace, no amount of Zro can rival the authority of the divine."
 f93_cozro.11.a:0 "One Revelation"
 f93_cozro.11.effect:0 "Homeworld gains the §rSanctified§! modifier"
 f93_cozro.12.name:0 "The Flickering Tunnel"
 f93_cozro.12.desc:0 "The Rift over §Y[This.GetName]§! was long regarded as sacred and untouchable, but this caution has ended.\nThrough great effort, the Palace has sent the $f93_imperial_strider$ before the downpouring Rift. The theories of our scientists appear to have been correct, for the $f93_imperial_strider$ had pierced its mind through the Rift. The Rift was a Shroud Tunnel all along.\n\nInside, the Strider was moved along the ever forward stretching Tunnel. It saw an ancient Zroni Vessel fleeing from something that felt like a wave of doom approaching from behind. The Zroni crew must have attempted to outrun the wave by stretching the almost instantaneous Shroud Tunnel through time.\nYet, the wave eventually reached the vessel before it could emerge out of the Tunnel, dusting the crew to Zro, which has been bleeding onto [This.GetName] every since. With the psionics aboard dead and nobody left to maintain the temporal distortion, the Tunnel rip apart mid-transit.\n\nIt began looping between the crew's death and the tunnel ripping apart. Unable to fully resolve and close. Now it endlessly flickers in time. Dusting [This.GetName] with Zro.\n\nHaving withdrawn from the Tunnel, the $f93_imperial_strider$ now presents us with three theories as to what it might achieve should it enter the flickering Tunnel once more."
 f93_cozro.12.a:0 "Widen the Passage"
 f93_cozro.12.a_effect:0 "Adds §G+10§! $i_zro$ income to the §Y$f93_zro_downpour$§! Modifier on §Y[This.GetName]§!"
 f93_cozro.12.b:0 "Steal from the Vessel"
 f93_cozro.12.b_effect:0 "Choose one of three powerful §Grelics§! from the Zroni"
 f93_cozro.12.c:0 "Complete the Arrival"
 f93_cozro.12.c_effect:0 "§RThis would end our civilisation!§!"
 f93_cozro.13.name:0 "Steal from the Zroni"
 f93_cozro.13.desc:0 "The $f93_imperial_strider$ has been given the task to retrieve an object from the Zroni vessel and is now reaching out to us. Which of the Zroni Artifacts should it take with it? By now, it's no longer grave robbing, but Archeology."
 f93_cozro.13.a:0 "$concept_zroni_storm_caster$"
#  f93_cozro.13.a_desc:0 "Take the ['concept_zroni_storm_caster']"
