 concept_f93_origin_children_zro_tips:0 ">>Gameplay Tips<<"
 concept_f93_origin_children_zro_tips_desc:0 "§W§BExploration:§!\nYou should start by finding the System with the special Zro Planet nearby. §gExplore via Hyperlanes§!, even if it's slow, this is how you explore in the early game. After colonizing the §r$pc_zro_desert$§!, begins a Situation that counts your Zro production. When you reach a certain Zro harvesting milestone, you will receive a tier two §rShroud Striders§! tech to use Jumps.\n\n§BSynergies:§!\nTry going for boni that affect/ add Elite and Worker (especially Technician!) jobs. Also, try to get your hands on early boni towards higher stability from either traits or specialist affecting civics for priests/ bureaucrats §R(the $pc_zro_desert$ starts with lowered stability!)§!\n\n§rPaladins (Elites)§! produce lots of £minor_artifacts£ §Y$minor_artifacts$§!, so maybe go for $ap_archaeoengineers$ as an Ascension Perk. $f93_zro_knight_plural$ also produce £unity£ §YUnity§! and £engineering£ §YEngineering§! research in fair quantities. Their Efficiency can be increased from §rZro Drifter (Workers)§! Jobs, who produce £sr_zro£ §YZro§!, the lifeblood of your Empire.\n\n§R(This works similar to Squires and Knights from the KoTG Origin)§!§!"
