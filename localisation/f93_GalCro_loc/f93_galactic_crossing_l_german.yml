 concept_bleeding_zro_desc:0 "$f93_d_bleeding_zro_desc$\n\n§EEffect:§!$TABBED_LIST$§G+$@bleeding_zro_production|*0$§! $i_zro$"
 f93_d_bleeding_zro:0 "Bleeding Zro"
 f93_d_bleeding_zro_desc:0 "A small rift beneath the Imperial Palace bleeds Zro into reality. But the rift is shrinking and the monopoly that the Palace had held for nearly a milennium is slowly coming to an end."
